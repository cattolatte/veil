<!doctype html>
<meta charset="utf-8">
<title>Veil</title>
<style>
  :root {
    --bg:#0f1117; --panel:#161a24; --line:#252b39; --ink:#e8ecf4; --dim:#8892a6;
    --accent:#818cf8; --accent-ink:#0f1117;
    --safe:#4ade80; --danger:#fb7185; --warn:#fbbf24;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#fff; --panel:#f7f8fb; --line:#e3e7ef; --ink:#161a24; --dim:#69738a;
            --accent:#4f46e5; --accent-ink:#fff; --safe:#059669; --danger:#e11d48; --warn:#b45309; }
  }
  *{box-sizing:border-box}
  body { margin:0; width:380px; background:var(--bg); color:var(--ink);
         font:13px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif; }
  header { display:flex; align-items:center; gap:8px; padding:13px 15px;
           border-bottom:1px solid var(--line); }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--accent);
         box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  .brand { font-weight:650; letter-spacing:-.01em; }
  header .sp { flex:1 }
  .icon-btn { background:none; border:0; color:var(--dim); cursor:pointer; padding:4px 6px;
              border-radius:5px; font-size:15px; line-height:1; min-height:auto; }
  .icon-btn:hover { background:var(--panel); color:var(--ink); }
  main { padding:15px }
  label.f { display:block; margin-bottom:11px }
  label.f > span { display:block; color:var(--dim); font-size:11.5px; margin-bottom:4px;
                   text-transform:uppercase; letter-spacing:.06em; font-weight:600; }
  input[type=text], input[type=url], input[type=number] {
    width:100%; padding:9px 10px; background:var(--panel); border:1px solid var(--line);
    border-radius:7px; color:var(--ink); font:13px inherit; }
  input:focus { outline:none; border-color:var(--accent);
                box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  .opts { display:flex; flex-direction:column; gap:7px; margin:0 0 13px }
  .opt { display:flex; align-items:center; gap:8px; color:var(--dim); font-size:12.5px; cursor:pointer }
  .opt input { accent-color:var(--accent); margin:0 }
  .opt .hint { margin-left:auto; font-size:11px; opacity:.75 }
  button.primary { width:100%; padding:11px; border:0; border-radius:7px; cursor:pointer;
                   background:var(--accent); color:var(--accent-ink); font:600 13.5px inherit; }
  button.primary:disabled { opacity:.5; cursor:default }
  .status { margin-top:11px; color:var(--dim); font-size:12px; min-height:16px }
  .verdict { margin-top:11px; padding:9px 11px; border-radius:7px; font-size:12.5px;
             font-weight:600; border:1px solid; display:none }
  .verdict.ok { display:block; border-color:color-mix(in srgb,var(--safe) 40%,transparent);
                color:var(--safe); background:color-mix(in srgb,var(--safe) 8%,transparent) }
  .verdict.err{ display:block; border-color:color-mix(in srgb,var(--danger) 40%,transparent);
                color:var(--danger); background:color-mix(in srgb,var(--danger) 8%,transparent) }
  .steps { margin-top:12px; border:1px solid var(--line); border-radius:7px; overflow:hidden; display:none }
  .steps.on { display:block }
  .step { display:flex; gap:9px; padding:8px 11px; border-bottom:1px solid var(--line); font-size:12px }
  .step:last-child { border:0 }
  .step .n { color:var(--dim); font-variant-numeric:tabular-nums; flex:none; width:15px }
  .step .body { flex:1; min-width:0 }
  .step .act { font-family:ui-monospace,Menlo,monospace; font-size:11.5px; color:var(--accent) }
  .step .why { color:var(--dim); font-size:11.5px; margin-top:1px;
               overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .step .t { color:var(--dim); font-size:11px; flex:none; font-variant-numeric:tabular-nums }
  .metrics { margin-top:12px; display:grid; grid-template-columns:1fr 1fr 1fr; gap:1px;
             background:var(--line); border:1px solid var(--line); border-radius:7px;
             overflow:hidden; display:none }
  .metrics.on { display:grid }
  .m { background:var(--panel); padding:9px 10px }
  .m .n { font:650 15px/1.2 ui-monospace,Menlo,monospace; font-variant-numeric:tabular-nums }
  .m .l { color:var(--dim); font-size:10.5px; margin-top:2px }
  .m .n.ok{color:var(--safe)} .m .n.bad{color:var(--danger)}
  .panel { display:none; padding:15px; border-top:1px solid var(--line); background:var(--panel) }
  .panel.on { display:block }
  .panel h2 { margin:0 0 11px; font-size:11.5px; text-transform:uppercase;
              letter-spacing:.06em; color:var(--dim) }
  .hist { max-height:210px; overflow:auto }
  .h { padding:8px 0; border-bottom:1px solid var(--line); font-size:12px }
  .h:last-child{border:0}
  .h .g { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .h .meta { color:var(--dim); font-size:11px; margin-top:2px }
  .empty { color:var(--dim); font-size:12px; padding:14px 0; text-align:center }
  .row { display:flex; gap:8px }
  .row button { flex:1; padding:8px; border-radius:6px; border:1px solid var(--line);
                background:transparent; color:var(--ink); font:12.5px inherit; cursor:pointer }
  .row button:hover { background:var(--bg) }
</style>

<header>
  <span class="dot"></span>
  <span class="brand">Veil</span>
  <span class="sp"></span>
  <button class="icon-btn" id="tab-history" title="History">&#9200;</button>
  <button class="icon-btn" id="tab-settings" title="Settings">&#9881;</button>
</header>

<main id="view-run">
  <label class="f"><span>Goal</span>
    <input type="text" id="goal" placeholder="What should the agent do?" value="Summarise this page"></label>

  <div class="opts">
    <label class="opt"><input type="checkbox" id="debug" checked> Show redaction overlay</label>
    <label class="opt"><input type="checkbox" id="screen"> Screen perception <span class="hint">~200 ms</span></label>
    <label class="opt"><input type="checkbox" id="neural"> Names &amp; addresses <span class="hint">neural</span></label>
    <label class="opt"><input type="checkbox" id="multi"> Multi-step <span class="hint">up to 8</span></label>
  </div>

  <button class="primary" id="run">Run agent</button>
  <div class="status" id="status">Ready.</div>
  <div class="verdict" id="verdict"></div>
  <div class="metrics" id="metrics"></div>
  <div class="steps" id="steps"></div>
</main>

<section class="panel" id="view-settings">
  <h2>Settings</h2>
  <label class="f"><span>Server URL</span>
    <input type="url" id="set-server" placeholder="http://127.0.0.1:8000"></label>
  <label class="f"><span>Max steps</span>
    <input type="number" id="set-steps" min="1" max="20" value="8"></label>
  <div class="opts">
    <label class="opt"><input type="checkbox" id="set-screen"> Screen perception on by default</label>
    <label class="opt"><input type="checkbox" id="set-neural"> Names &amp; addresses on by default</label>
    <label class="opt"><input type="checkbox" id="set-multi"> Multi-step on by default</label>
    <label class="opt"><input type="checkbox" id="set-history" checked> Keep run history</label>
  </div>
  <div class="row"><button id="set-save">Save</button><button id="set-close">Close</button></div>
</section>

<section class="panel" id="view-history">
  <h2>Recent runs</h2>
  <div class="hist" id="hist"></div>
  <div class="row"><button id="hist-clear">Clear</button><button id="hist-close">Close</button></div>
</section>

<script src="../dist/popup.js"></script>
