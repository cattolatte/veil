name: Deploy demo

# Publishes ONLY the demo directory. The rest of the repository - server,
# evaluation harnesses, training code, decision records - stays private.
#
# Note that a Pages site is public even when the repository is private, so
# whatever lands in demo/ is world-readable. Keep it to the demo.

on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - 'extension/src/**'      # the demo bundles these
      - 'build.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # Produces demo/veil-test.js. The bundle is gitignored precisely so the
      # published demo can never be a stale copy of the source.
      - name: Build demo bundle
        run: npm run build

      - name: Stage the demo only
        run: |
          mkdir -p _site
          cp demo/index.html _site/
          cp demo/veil-test.js _site/
          # A demo page needs no crawler traffic, and the URL is for a panel.
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          echo '<meta name="robots" content="noindex">' >> _site/index.html
          echo "published files:"; ls -la _site

      - name: Fail if anything else slipped in
        run: |
          UNEXPECTED=$(ls _site | grep -vE '^(index\.html|veil-test\.js|robots\.txt)$' || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::unexpected files staged for publication: $UNEXPECTED"; exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
